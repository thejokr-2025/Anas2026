      - name: تجهيز Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت Gradle 8.9
        run: |
          set -e
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "/tmp/gradle-8.9/bin" >> $GITHUB_PATH

      - name: بناء APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: عرض الأخطاء عند الفشل
        if: failure()
        run: |
          echo "========== أخطاء الترجمة =========="
          grep -E "^e: |error: |Unresolved reference|What went wrong" -A3 /tmp/build.log | head -80 || true
          echo "========== آخر 60 سطر =========="
          tail -60 /tmp/build.log || true

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: AnasArchive-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
